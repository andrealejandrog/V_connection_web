name: Deploy to Firebase Hosting on Push
on:
  push:
    branches:
      - main # Or your main development branch (e.g., main, master)
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V_CONNECTION_WEBPAGE }}
          projectId: v-connection-webpage
          entryPoint: ./
          # publicDir: .next # The action might infer this or use firebase.json
          # The following lines for preview channels are REMOVED:
          # expires: 7d
          # channelId: