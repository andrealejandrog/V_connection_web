name: Deploy to Firebase Hosting on Push
on:
  push:
    branches:
      - main # Or your main development branch
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build # Ensures static export to 'out'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V_CONNECTION_WEBPAGE }}
          projectId: v-connection-webpage
          entryPoint: ./
          publicDir: out
          target: v-connection-webpage # Explicitly target the hosting site ID

        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels