name: Deploy to Firebase Hosting on Push
on:
  push:
    branches:
      - main # Or your main development branch
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build # Ensures static export to 'out'

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools@latest
          firebase deploy --project=${{ secrets.FIREBASE_PROJECT_ID }} --token="${{ secrets.FIREBASE_DEPLOY_TOKEN }}" --only hosting:${{ github.repository }}

        env:
          FIREBASE_PROJECT_ID: v-connection-webpage